<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ArtRaccoon Studio — OAuth callback</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #14121a; color: #ece8f4;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 34rem; margin: 2rem; padding: 2rem 2.2rem; border-radius: 18px;
          background: #1d1a26; border: 1px solid #2e2939; }
  h1 { margin: 0 0 .6rem; font-size: 1.35rem; font-weight: 600; }
  p { margin: .6rem 0 0; line-height: 1.55; color: #b8b2c6; }
  a { color: #a99bf0; }
</style>
</head>
<body>
  <div class="card">
    <h1>OAuth callback — ArtRaccoon Studio</h1>
    <p>Этот адрес служебный: сюда Pinterest возвращает после авторизации приложения «ArtRaccoon Studio Repost».</p>
    <p id="state">Если ты видишь эту страницу вручную, ничего делать не нужно — просто закрой её.</p>
    <p><a href="/">На главную студии</a></p>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var el = document.getElementById('state');
      if (q.has('code')) {
        el.textContent = 'Код авторизации получен. Скопируй адрес страницы целиком и передай его в студию — по нему приложение завершит подключение.';
      } else if (q.has('error')) {
        el.textContent = 'Pinterest вернул ошибку: ' + (q.get('error_description') || q.get('error'));
      }
    })();
  </script>
</body>
</html>
